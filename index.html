<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CyberPenguin Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e14; color: #00ffcc; font-family: 'Segoe UI', monospace; display: flex; flex-direction: column; height: 100vh; }
    #header { background: #141c24; padding: 16px; border-bottom: 1px solid #00ffcc44; text-align: center; font-size: 24px; }
    #header span { color: #ff66aa; }
    #login { display: flex; gap: 10px; padding: 12px; background: #0f161e; flex-wrap: wrap; }
    #login input { flex: 1; background: #1a222c; color: #00ffcc; border: none; padding: 10px; border-radius: 8px; }
    #login button { background: #00ffcc; color: #0a0e14; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; list-style: none; background: #0b0f14; }
    #messages li { padding: 8px 14px; margin-bottom: 6px; background: #141c24; border-radius: 8px; border-left: 3px solid #00ffcc; }
    #messages li.system { color: #ffaa66; font-style: italic; border-left-color: #ffaa66; }
    #messages li strong { color: #ff66aa; }
    #form { display: flex; padding: 12px; background: #141c24; border-top: 1px solid #00ffcc44; }
    #input { flex: 1; background: #1a222c; color: #00ffcc; border: none; padding: 12px; border-radius: 8px 0 0 8px; outline: none; }
    #form button { background: #00ffcc; color: #0a0e14; border: none; padding: 12px 24px; font-weight: bold; cursor: pointer; border-radius: 0 8px 8px 0; }
    @media (max-width: 600px) {
      #header { font-size: 18px; }
      #input { font-size: 14px; padding: 10px; }
      #form button { padding: 10px 16px; }
      #login { flex-direction: column; }
      #login button { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="header">🐧 CyberPenguin <span>Chat</span></div>
  <div id="login">
    <input id="usernameInput" placeholder="Takma adın ne olsun?" />
    <button id="joinBtn">Katıl</button>
  </div>
  <ul id="messages"></ul>
  <form id="form" style="display:none;">
    <input id="input" placeholder="Bir şey yaz..." />
    <button>Gönder</button>
  </form>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const loginDiv = document.getElementById('login');
    const usernameInput = document.getElementById('usernameInput');
    const joinBtn = document.getElementById('joinBtn');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const header = document.getElementById('header');
    let username = 'Bir penguen';

    joinBtn.onclick = () => {
      const val = usernameInput.value.trim();
      if (val) {
        username = val;
        loginDiv.style.display = 'none';
        form.style.display = 'flex';
        header.innerHTML = `🐧 CyberPenguin <span>Chat</span> — ${username}`;
        socket.emit('user joined', username);
        const li = document.createElement('li');
        li.className = 'system';
        li.textContent = `👋 ${username} sohbete katıldı.`;
        messages.appendChild(li);
        input.focus();
      }
    };

    usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (msg) {
        socket.emit('chat message', { username, msg });
        input.value = '';
        input.focus();
      }
    });

    socket.on('chat message', (data) => {
      const li = document.createElement('li');
      li.innerHTML = `<strong>${data.username}</strong>: ${data.msg}`;
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    });

    socket.on('user joined', (name) => {
      const li = document.createElement('li');
      li.className = 'system';
      li.textContent = `👋 ${name} sohbete katıldı.`;
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    });

    setTimeout(() => {
      const li = document.createElement('li');
      li.className = 'system';
      li.textContent = '🐧 Herkese merhaba. Sohbet açık.';
      messages.appendChild(li);
    }, 300);
  </script>
</body>
</html>
