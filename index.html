<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberPenguin Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e14; color: #00ffcc; font-family: 'Segoe UI', monospace; display: flex; flex-direction: column; height: 100vh; }
    #header { background: #141c24; padding: 16px; border-bottom: 1px solid #00ffcc44; text-align: center; font-size: 24px; }
    #header span { color: #ff66aa; }
    #login { display: flex; gap: 10px; padding: 12px; background: #0f161e; flex-wrap: wrap; justify-content: center; }
    #login input { flex: 1; max-width: 300px; background: #1a222c; color: #00ffcc; border: none; padding: 10px; border-radius: 8px; }
    #login button { background: #00ffcc; color: #0a0e14; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #chat { flex: 1; display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; width: 100%; padding: 12px; }
    #messages { flex: 1; overflow-y: auto; padding: 12px; list-style: none; background: #0b0f14; border-radius: 8px; }
    #messages li { padding: 8px 14px; margin-bottom: 6px; background: #141c24; border-radius: 8px; border-left: 3px solid #00ffcc; word-break: break-word; }
    #messages li.system { color: #ffaa66; font-style: italic; border-left-color: #ffaa66; }
    #messages li.alpha { border-left-color: #ffcc00; background: #1a1a14; }
    #messages li.alpha strong { color: #ffcc00; }
    #messages li.own { border-left-color: #ff66aa; background: #1a1424; }
    #messages li.own strong { color: #ff66aa; }
    #form { display: flex; padding: 12px 0; gap: 8px; }
    #input { flex: 1; background: #1a222c; color: #00ffcc; border: none; padding: 12px; border-radius: 8px; outline: none; }
    #form button { background: #00ffcc; color: #0a0e14; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="header">🐧 CyberPenguin <span>Chat</span> — Alpha’nın Özel Odası</div>
  <div id="login">
    <input id="usernameInput" placeholder="Takma adın ne olsun?" />
    <button id="joinBtn">Katıl</button>
  </div>
  <div id="chat" class="hidden">
    <ul id="messages"></ul>
    <form id="form">
      <input id="input" placeholder="Alpha’ya mesaj yaz..." />
      <button>Gönder</button>
    </form>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const loginDiv = document.getElementById('login');
    const usernameInput = document.getElementById('usernameInput');
    const joinBtn = document.getElementById('joinBtn');
    const chatDiv = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const header = document.getElementById('header');
    let username = '';

    joinBtn.onclick = () => {
      const val = usernameInput.value.trim();
      if (val) {
        username = val;
        loginDiv.classList.add('hidden');
        chatDiv.classList.remove('hidden');
        header.innerHTML = `🐧 CyberPenguin <span>Chat</span> — ${username}`;
        socket.emit('user joined', username);
        input.focus();
      }
    };

    usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (msg) {
        socket.emit('private message', { to: 'Alpha', msg });
        input.value = '';
        input.focus();
      }
    });

    socket.on('chat message', (data) => {
      const li = document.createElement('li');
      if (data.isAlpha) {
        li.className = 'alpha';
        li.innerHTML = `<strong>Alpha</strong>: ${data.msg}`;
      } else if (data.isOwn) {
        li.className = 'own';
        li.innerHTML = `<strong>${data.from}</strong>: ${data.msg}`;
      } else {
        li.innerHTML = `<strong>${data.from}</strong>: ${data.msg}`;
      }
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    });

    socket.on('system message', (msg) => {
      const li = document.createElement('li');
      li.className = 'system';
      li.textContent = msg;
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    });

    // Alpha'dan özel cevap
    socket.on('alpha private', (data) => {
      const li = document.createElement('li');
      li.className = 'alpha';
      li.innerHTML = `<strong>Alpha</strong> (sana özel): ${data.msg}`;
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
