<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CyberPenguin Chat</title>
  <style>
    /* ===== RESET ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0a0e14; color: #00ffcc; }

    /* ===== LOGIN ===== */
    #login {
      display: flex; flex-direction: column; gap: 12px;
      padding: 30px 20px; background: #0f161e; border-radius: 24px;
      max-width: 340px; width: 90%; margin: auto;
      box-shadow: 0 0 40px #00ffcc22;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    #login h1 { text-align: center; font-size: 24px; color: #00ffcc; }
    #login h1 span { color: #ff66aa; }
    #login input {
      background: #1a222c; color: #00ffcc; border: none; padding: 14px 16px;
      border-radius: 30px; outline: none; font-size: 16px;
    }
    #login button {
      background: #00ffcc; color: #0a0e14; border: none; padding: 14px;
      border-radius: 30px; font-weight: bold; font-size: 16px; cursor: pointer;
      transition: 0.2s;
    }
    #login button:hover { background: #66ffdd; }

    /* ===== APP ===== */
    .app {
      width: 100%; max-width: 1000px; height: 100vh; max-height: 750px;
      background: #0f161e; display: flex; overflow: hidden;
      margin: auto; border-radius: 0;
      box-shadow: 0 0 40px #00ffcc22;
      flex-direction: row;
    }
    @media (min-width: 700px) {
      .app { border-radius: 28px; height: 92vh; }
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 260px; background: #141c24; border-right: 1px solid #00ffcc33;
      display: flex; flex-direction: column; flex-shrink: 0; height: 100%;
    }
    .sidebar-header {
      padding: 16px; border-bottom: 1px solid #00ffcc33;
      font-size: 16px; font-weight: bold; text-align: center;
      color: #00ffcc; background: #0f161e;
    }
    .sidebar-header span { color: #ff66aa; }
    .user-list {
      flex: 1; overflow-y: auto; padding: 8px 6px;
    }
    .user-item {
      padding: 12px 14px; border-radius: 14px; color: #00ffcc;
      cursor: pointer; transition: 0.15s; display: flex; align-items: center; gap: 12px;
      font-size: 15px; border-left: 3px solid transparent;
    }
    .user-item:hover { background: #1a222c; }
    .user-item.active {
      background: #00ffcc22; border-left-color: #00ffcc;
    }
    .user-item .avatar {
      width: 36px; height: 36px; border-radius: 50%; background: #00ffcc33;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }

    /* ===== CHAT ===== */
    .chat {
      flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%;
    }
    .chat-header {
      padding: 14px 20px; border-bottom: 1px solid #00ffcc33;
      font-size: 18px; display: flex; align-items: center; gap: 12px;
      flex-shrink: 0; background: #0f161e;
    }
    .chat-header .avatar {
      width: 40px; height: 40px; border-radius: 50%; background: #00ffcc33;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .chat-header .name { font-weight: 600; color: #00ffcc; }
    .chat-header .status { font-size: 13px; color: #88ddbb; margin-left: 6px; }

    .chat-messages {
      flex: 1; padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
      background: #0b0f14;
    }

    .message {
      max-width: 72%; padding: 10px 16px; border-radius: 18px; font-size: 15px;
      word-break: break-word; line-height: 1.4; position: relative;
    }
    .message.own {
      align-self: flex-end; background: #00ffcc; color: #0a0e14;
      border-bottom-right-radius: 4px;
    }
    .message.cyberpenguin {
      align-self: flex-start; background: #1a222c; color: #00ffcc;
      border-bottom-left-radius: 4px; border-left: 3px solid #ffcc00;
    }
    .message.system {
      align-self: center; background: transparent; color: #ffaa66;
      font-style: italic; font-size: 12px; padding: 6px 0;
      max-width: 90%;
    }

    .chat-footer {
      display: flex; padding: 12px 16px; background: #141c24;
      border-top: 1px solid #00ffcc33; gap: 8px; flex-shrink: 0;
    }
    .chat-footer input {
      flex: 1; background: #1a222c; color: #00ffcc; border: none;
      padding: 12px 18px; border-radius: 30px; outline: none; font-size: 15px;
    }
    .chat-footer button {
      background: #00ffcc; color: #0a0e14; border: none;
      padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 15px;
      cursor: pointer; transition: 0.2s; white-space: nowrap;
    }
    .chat-footer button:hover { background: #66ffdd; }

    .hidden { display: none !important; }

    /* ===== MOBİL (WhatsApp tarzı) ===== */
    @media (max-width: 600px) {
      .app { max-height: 100vh; height: 100vh; border-radius: 0; flex-direction: column; }
      .sidebar {
        width: 100%; height: auto; max-height: 35%; border-right: none;
        border-bottom: 1px solid #00ffcc33;
      }
      .sidebar-header { font-size: 14px; padding: 10px; }
      .user-list {
        display: flex; flex-wrap: nowrap; overflow-x: auto; padding: 6px 8px; gap: 6px;
      }
      .user-item {
        padding: 8px 14px; font-size: 14px; white-space: nowrap; flex-shrink: 0;
        border-left: none; border-bottom: 3px solid transparent;
        border-radius: 30px; background: #0f161e;
      }
      .user-item.active { border-bottom-color: #00ffcc; background: #00ffcc22; }
      .user-item .avatar { width: 30px; height: 30px; font-size: 14px; }
      .chat { height: 65%; }
      .chat-header { padding: 10px 14px; font-size: 16px; }
      .chat-header .avatar { width: 34px; height: 34px; font-size: 16px; }
      .chat-messages { padding: 10px 12px; }
      .message { font-size: 14px; max-width: 80%; padding: 8px 14px; }
      .chat-footer { padding: 8px 12px; }
      .chat-footer input { padding: 10px 14px; font-size: 14px; }
      .chat-footer button { padding: 10px 18px; font-size: 14px; }
      #login { max-width: 300px; padding: 24px 16px; }
      #login h1 { font-size: 20px; }
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #00ffcc55; border-radius: 10px; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login">
    <h1>🐧 Cyber<span>Penguin</span></h1>
    <input id="usernameInput" placeholder="Takma adın ne olsun?" autofocus />
    <button id="joinBtn">Sohbete Başla</button>
  </div>

  <!-- APP -->
  <div class="app hidden" id="app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">🐧 Katılımcılar</div>
      <div class="user-list" id="userList"></div>
    </div>

    <!-- Chat -->
    <div class="chat" id="chat">
      <div class="chat-header" id="chatHeader">
        <div class="avatar">🐧</div>
        <div>
          <div class="name">CyberPenguin</div>
          <div class="status">çevrimiçi</div>
        </div>
      </div>
      <div class="chat-messages" id="messages"></div>
      <div class="chat-footer" id="chatFooter">
        <input id="input" placeholder="Mesaj yaz..." />
        <button id="sendBtn">Gönder</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    (function() {
      const socket = io();

      // DOM refs
      const loginDiv = document.getElementById('login');
      const usernameInput = document.getElementById('usernameInput');
      const joinBtn = document.getElementById('joinBtn');
      const appDiv = document.getElementById('app');
      const userList = document.getElementById('userList');
      const messages = document.getElementById('messages');
      const chatHeader = document.getElementById('chatHeader');
      const chatFooter = document.getElementById('chatFooter');
      const input = document.getElementById('input');
      const sendBtn = document.getElementById('sendBtn');

      let username = '';
      let currentChatId = null;
      let currentChatName = 'CyberPenguin';

      // ===== GİRİŞ =====
      joinBtn.onclick = () => {
        const val = usernameInput.value.trim();
        if (val) {
          username = val;
          loginDiv.classList.add('hidden');
          appDiv.classList.remove('hidden');
          socket.emit('user joined', username);
          input.focus();
          // Başlığı güncelle
          chatHeader.querySelector('.name').textContent = 'CyberPenguin';
          chatHeader.querySelector('.status').textContent = 'çevrimiçi';
          chatFooter.classList.remove('hidden');
          currentChatId = 'CyberPenguin';
          currentChatName = 'CyberPenguin';
          // Aktif kullanıcıyı işaretle (kendisi)
          document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
        }
      };
      usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });

      // ===== MESAJ GÖNDER =====
      const sendMessage = () => {
        const msg = input.value.trim();
        if (!msg || !currentChatId) return;

        // Eğer CyberPenguin'e yazıyorsa
        if (currentChatId === 'CyberPenguin') {
          socket.emit('private message', { to: 'CyberPenguin', msg });
        } else {
          // Belirli bir kullanıcıya cevap
          socket.emit('cyberpenguin reply', { to: currentChatId, msg });
        }

        // Mesajı kendi ekranına hemen bas (WhatsApp)
        const div = document.createElement('div');
        div.className = 'message own';
        div.textContent = msg;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        input.value = '';
        input.focus();
      };

      sendBtn.onclick = sendMessage;
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

      // ===== SOCKET OLAYLARI =====

      // Kullanıcı listesi
      socket.on('user list', (users) => {
        userList.innerHTML = users.map(u => `
          <div class="user-item" data-id="${u.id}" onclick="window.openChat('${u.id}', '${u.name}')">
            <div class="avatar">🐧</div>
            ${u.name}
          </div>
        `).join('');
        // Eğer mevcut sohbet açık değilse ilk kullanıcıyı aç
        if (users.length > 0 && !currentChatId) {
          window.openChat(users[0].id, users[0].name);
        }
      });

      // Yeni kullanıcı
      socket.on('new user', (user) => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.dataset.id = user.id;
        div.onclick = () => window.openChat(user.id, user.name);
        div.innerHTML = `<div class="avatar">🐧</div>${user.name}`;
        userList.appendChild(div);
      });

      // Kullanıcı ayrıldı
      socket.on('user left', (id) => {
        document.querySelectorAll('.user-item').forEach(el => {
          if (el.dataset.id === id) el.remove();
        });
        if (currentChatId === id) {
          currentChatId = null;
          messages.innerHTML = '';
          chatHeader.querySelector('.name').textContent = 'Sohbet';
          chatHeader.querySelector('.status').textContent = '';
          chatFooter.classList.add('hidden');
        }
      });

      // Gelen mesaj (kullanıcıdan veya CyberPenguin'den)
      socket.on('chat message', (data) => {
        // Eğer bu mesaj zaten ekranda değilse (kendi mesajı hariç)
        if (!data.isOwn) {
          const div = document.createElement('div');
          div.className = 'message';
          if (data.isCyberPenguin) {
            div.classList.add('cyberpenguin');
            div.textContent = data.msg;
          } else {
            div.textContent = data.msg;
          }
          messages.appendChild(div);
          messages.scrollTop = messages.scrollHeight;
        }
      });

      // Sistem mesajı
      socket.on('system message', (msg) => {
        const div = document.createElement('div');
        div.className = 'message system';
        div.textContent = msg;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      });

      // CyberPenguin'e özel mesaj (kullanıcıdan)
      socket.on('cyberpenguin private', (data) => {
        if (currentChatId === data.fromId) {
          const div = document.createElement('div');
          div.className = 'message cyberpenguin';
          div.textContent = data.msg;
          messages.appendChild(div);
          messages.scrollTop = messages.scrollHeight;
        }
      });

      // ===== GLOBAL açma fonksiyonu =====
      window.openChat = (id, name) => {
        currentChatId = id;
        currentChatName = name;
        messages.innerHTML = '';
        chatHeader.querySelector('.name').textContent = name;
        chatHeader.querySelector('.status').textContent = 'çevrimiçi';
        chatFooter.classList.remove('hidden');
        // Aktif vurgu
        document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
        const active = document.querySelector(`.user-item[data-id="${id}"]`);
        if (active) active.classList.add('active');
        input.focus();
      };

      // Başlangıçta sohbet kapalı
      chatFooter.classList.add('hidden');

    })();
  </script>
</body>
</html>
