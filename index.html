<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberPenguin Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e14; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .app { width: 100%; max-width: 800px; height: 90vh; background: #0f161e; border-radius: 20px; display: flex; overflow: hidden; box-shadow: 0 0 30px #00ffcc22; }
    .sidebar { width: 250px; background: #141c24; border-right: 1px solid #00ffcc44; display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #00ffcc44; color: #00ffcc; font-size: 18px; font-weight: bold; text-align: center; }
    .user-list { flex: 1; overflow-y: auto; padding: 8px; }
    .user-item { padding: 12px; border-radius: 12px; color: #00ffcc; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
    .user-item:hover { background: #1a222c; }
    .user-item.active { background: #00ffcc22; border-left: 3px solid #00ffcc; }
    .chat { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 16px; border-bottom: 1px solid #00ffcc44; color: #00ffcc; font-size: 18px; display: flex; align-items: center; gap: 10px; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .message { max-width: 70%; padding: 10px 14px; border-radius: 16px; font-size: 14px; word-break: break-word; }
    .message.own { align-self: flex-end; background: #00ffcc; color: #0a0e14; border-bottom-right-radius: 4px; }
    .message.cyberpenguin { align-self: flex-start; background: #141c24; color: #00ffcc; border-bottom-left-radius: 4px; border-left: 3px solid #ffcc00; }
    .message.system { align-self: center; background: transparent; color: #ffaa66; font-style: italic; font-size: 12px; padding: 4px 0; }
    .chat-footer { display: flex; padding: 12px; background: #141c24; border-top: 1px solid #00ffcc44; gap: 8px; }
    .chat-footer input { flex: 1; background: #1a222c; color: #00ffcc; border: none; padding: 10px 14px; border-radius: 20px; outline: none; font-size: 14px; }
    .chat-footer button { background: #00ffcc; color: #0a0e14; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .hidden { display: none; }
    #login { display: flex; flex-direction: column; gap: 10px; padding: 20px; background: #0f161e; border-radius: 20px; max-width: 300px; width: 100%; }
    #login input { background: #1a222c; color: #00ffcc; border: none; padding: 12px; border-radius: 20px; outline: none; }
    #login button { background: #00ffcc; color: #0a0e14; border: none; padding: 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div id="login">
    <input id="usernameInput" placeholder="Takma adın ne olsun?" />
    <button id="joinBtn">Sohbete Başla</button>
  </div>
  <div class="app hidden" id="app">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">🐧 Katılımcılar</div>
      <div class="user-list" id="userList"></div>
    </div>
    <div class="chat" id="chat">
      <div class="chat-header" id="chatHeader">💬 Sohbet</div>
      <div class="chat-messages" id="messages"></div>
      <div class="chat-footer">
        <input id="input" placeholder="Mesaj yaz..." />
        <button id="sendBtn">Gönder</button>
      </div>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const loginDiv = document.getElementById('login');
    const usernameInput = document.getElementById('usernameInput');
    const joinBtn = document.getElementById('joinBtn');
    const appDiv = document.getElementById('app');
    const userList = document.getElementById('userList');
    const messages = document.getElementById('messages');
    const chatHeader = document.getElementById('chatHeader');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    let username = '';
    let currentChatId = null;

    joinBtn.onclick = () => {
      const val = usernameInput.value.trim();
      if (val) {
        username = val;
        loginDiv.classList.add('hidden');
        appDiv.classList.remove('hidden');
        socket.emit('user joined', username);
        input.focus();
      }
    };

    usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });

    const sendMessage = () => {
      const msg = input.value.trim();
      if (!msg || !currentChatId) return;
      
      if (currentChatId === 'CyberPenguin') {
        socket.emit('private message', { to: 'CyberPenguin', msg });
      } else {
        socket.emit('cyberpenguin reply', { to: currentChatId, msg });
      }
      input.value = '';
      input.focus();
    };

    sendBtn.onclick = sendMessage;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    socket.on('user list', (users) => {
      userList.innerHTML = users.map(u => `
        <div class="user-item" data-id="${u.id}" onclick="openChat('${u.id}', '${u.name}')">
          🐧 ${u.name}
        </div>
      `).join('');
    });

    socket.on('new user', (user) => {
      const div = document.createElement('div');
      div.className = 'user-item';
      div.dataset.id = user.id;
      div.onclick = () => openChat(user.id, user.name);
      div.textContent = `🐧 ${user.name}`;
      userList.appendChild(div);
    });

    socket.on('user left', (id) => {
      const items = userList.querySelectorAll('.user-item');
      items.forEach(item => {
        if (item.dataset.id === id) item.remove();
      });
      if (currentChatId === id) {
        currentChatId = null;
        messages.innerHTML = '';
        chatHeader.textContent = '💬 Sohbet';
        document.querySelector('.chat-footer').classList.add('hidden');
      }
    });

    window.openChat = (id, name) => {
      currentChatId = id;
      messages.innerHTML = '';
      chatHeader.innerHTML = `💬 ${name}`;
      document.querySelector('.chat-footer').classList.remove('hidden');
      userList.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
      const active = userList.querySelector(`[data-id="${id}"]`);
      if (active) active.classList.add('active');
      input.focus();
    };

    socket.on('chat message', (data) => {
      const div = document.createElement('div');
      div.className = 'message';
      if (data.isCyberPenguin) {
        div.classList.add('cyberpenguin');
        div.textContent = data.msg;
      } else if (data.isOwn) {
        div.classList.add('own');
        div.textContent = data.msg;
      } else {
        div.textContent = data.msg;
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    });

    socket.on('system message', (msg) => {
      const div = document.createElement('div');
      div.className = 'message system';
      div.textContent = msg;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    });

    socket.on('cyberpenguin private', (data) => {
      // Yeni kullanıcıdan mesaj geldiğinde, CyberPenguin'in sohbetine ekle
      if (currentChatId === data.fromId) {
        const div = document.createElement('div');
        div.className = 'message cyberpenguin';
        div.textContent = data.msg;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }
    });
  </script>
</body>
</html>
